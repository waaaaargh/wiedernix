name: Build

# Sample build of a few packages on x86_64-darwin. Extend DEFAULT_ATTRS below
# with whatever should be kept building.

on:
  push:
    branches:
      - master
      - nixpkgs-26.11-darwin
  pull_request:
  workflow_dispatch:
    inputs:
      attrs:
        description: "Space-separated attributes to build (overrides the default list)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    # GitHub-hosted runners cap jobs at 6h; x86_64-darwin is no longer built
    # by Hydra, so the first build of stdenv comes from source.
    timeout-minutes: 360
    env:
      DEFAULT_ATTRS: >-
        stdenv
        libffi
        darwin.file_cmds
        hello
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: samueldr/lix-gha-installer-action@8dc19fbd6451fa106a68ecb2dafeeeb90dff3a29
        with:
          extra_nix_config: |
            sandbox = true
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0

      # Optional: set CACHIX_AUTH_TOKEN and the CACHIX_NAME variable to keep
      # built paths between runs. Without them this step is skipped.
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        env:
          INPUT_ATTRS: ${{ inputs.attrs }}
        run: |
          nix build .#stdenv

